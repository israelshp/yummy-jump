<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קפיצה טעימה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one full-screen sky canvas, a chunky HUD strip on top, big touch pads at the bottom corners. Single bright daytime look on purpose. */
:root{
  --sky-top:#7fd3ff; --sky-low:#d8f3ff; --ink:#3a2a5c; --sun:#ffd23f;
  --pop:#ff5d8f; --leaf:#5cc45c; --card:#fffdf5; --shadow:rgba(58,42,92,.25);
  --font-play:"Fredoka","Comic Sans MS","Chalkboard SE",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;}
[hidden]{display:none!important;}
body{background:var(--sky-top);color:var(--ink);font-family:var(--font-play);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
#game{position:relative;width:100%;height:100%;overflow:hidden;}
canvas{display:block;width:100%;height:100%;}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;}
.pill{background:var(--card);border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 var(--shadow);font-weight:700;font-size:clamp(16px,3.2vw,24px);display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;}
.talk{pointer-events:auto;border:0;cursor:pointer;font:inherit;font-size:clamp(16px,3.2vw,24px);color:var(--ink);padding:4px 12px;}
.talk[aria-pressed="false"]{opacity:.45;text-decoration:line-through;}
.talk:focus-visible{outline:4px solid var(--pop);outline-offset:3px;}
.pill span{display:inline-flex;align-items:center;gap:2px;}
.hearts{letter-spacing:2px;}
.pads{direction:ltr;position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.pads .group{display:flex;gap:14px;}
.pad{pointer-events:auto;width:clamp(64px,16vw,92px);height:clamp(64px,16vw,92px);border-radius:50%;border:0;background:rgba(255,253,245,.85);color:var(--ink);
  font:700 clamp(26px,6vw,40px)/1 var(--font-play);box-shadow:0 6px 0 var(--shadow);display:grid;place-items:center;touch-action:none;}
.pad.jump{background:var(--sun);width:clamp(80px,20vw,112px);height:clamp(80px,20vw,112px);}
.pad.on{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow);}
.pad:focus-visible,.btn:focus-visible{outline:4px solid var(--pop);outline-offset:3px;}
@media (hover:hover) and (pointer:fine){.pads{display:none;}}
.screen[hidden]{display:none;}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(127,211,255,.55);}
.card{background:var(--card);border-radius:28px;box-shadow:0 10px 0 var(--shadow);padding:22px 26px;text-align:center;max-width:460px;width:100%;}
.card h1{font-size:clamp(38px,9vw,64px);line-height:1;margin:0 0 6px;color:var(--pop);text-wrap:balance;text-shadow:0 4px 0 #ffd0de;}
.card p{font-size:clamp(17px,3.6vw,21px);margin:6px 0;line-height:1.3;}
.rows{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:12px 0;font-size:clamp(17px,3.6vw,21px);}
.rows div{display:flex;flex-direction:column;align-items:center;}
.rows b{font-size:clamp(30px,7vw,42px);line-height:1.1;}
.rows small{font-size:15px;font-weight:700;}
.qh{font-size:clamp(32px,8vw,52px)!important;}
.eq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;margin:12px 0;font-size:clamp(26px,6.5vw,38px);line-height:1.2;}
.eq .grp{display:inline-flex;flex-wrap:wrap;justify-content:center;max-width:9.5em;background:rgba(127,211,255,.18);border-radius:16px;padding:4px 8px;}
.eq b{font-size:1.1em;}
.eq .tail{display:inline-flex;gap:12px;white-space:nowrap;}
.eq .qm{color:var(--pop);min-width:1.2em;}
.answers{direction:ltr;display:flex;justify-content:center;gap:clamp(10px,4vw,22px);margin-top:10px;}
.ans{width:clamp(70px,20vw,96px);height:clamp(70px,20vw,96px);border-radius:24px;border:0;background:var(--sun);color:var(--ink);font:700 clamp(34px,9vw,48px)/1 var(--font-play);box-shadow:0 6px 0 var(--shadow);cursor:pointer;}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow);}
.ans:focus-visible{outline:4px solid var(--pop);outline-offset:3px;}
.ans.right{background:var(--leaf);color:#fff;}
.ans.wrong{background:#e7e2ea;color:#a79fb0;box-shadow:none;animation:shake .4s;}
.hint{font-weight:700;min-height:1.3em;}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.ans.wrong{animation:none;}}
.btn{margin-top:12px;border:0;border-radius:999px;background:var(--leaf);color:#fff;font:700 clamp(22px,5vw,30px)/1 var(--font-play);padding:14px 36px;box-shadow:0 6px 0 #3a8f3a;cursor:pointer;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3a8f3a;}
.keys{font-size:15px;opacity:.8;}
@media (prefers-reduced-motion:reduce){.btn:active,.pad.on{transform:none;}}
</style>
</head>
<body>

<div id="game" dir="rtl" lang="he">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill hearts" id="hearts">❤️❤️❤️</div>
    <button class="pill talk" id="talk" aria-pressed="true" aria-label="דיבור">🗣️</button>
    <div class="pill" id="score"></div>
  </div>
  <div class="pads">
    <div class="group">
      <button class="pad" id="padL" aria-label="שמאלה">◀</button>
      <button class="pad" id="padR" aria-label="ימינה">▶</button>
    </div>
    <button class="pad jump" id="padJ" aria-label="קפיצה">⬆</button>
  </div>
  <div class="screen" id="screen">
    <div class="card" id="cardBody"></div>
  </div>
</div>

<script>
(()=>{
const GOOD=[{e:'🥑',n:'avocado'},{e:'🍫',n:'chocolate'},{e:'🍝',n:'pasta'},{e:'🍌',n:'banana'}];
const BAD=['🧅','🥦','🍣'];
const MAXH=5, MAXB=9, H=540, GROUND=470, GRAV=1900, SPEED=300, JUMP=820;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hud={hearts:document.getElementById('hearts'),score:document.getElementById('score')};
const screen=document.getElementById('screen'), cardBody=document.getElementById('cardBody');
let scale=1, viewW=800, dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;scale=cv.height/H;viewW=cv.width/scale;}
addEventListener('resize',resize);

/* ---------- sound ---------- */
let ac=null;
function beep(freqs,dur=.09,type='triangle',vol=.15){if(!ac)return;let t=ac.currentTime;for(const f of freqs){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);t+=dur*.8;}}
const sfx={yum:()=>beep([660,880,1100]),jump:()=>beep([400,600],.07,'square',.06),yuck:()=>beep([300,200],.15,'sawtooth',.08),win:()=>beep([523,659,784,1046,1318],.14),sis:()=>beep([784,988,1175,988,1319,1568],.1,'sine',.16),hug:()=>beep([523,659,784,659,784,1046],.13,'sine',.18)};


/* ---------- talking (Hebrew computer voice) ---------- */
const FOODNAME={avocado:'אבוקדו',chocolate:'שוקולד',pasta:'פסטה',banana:'בננה'};
const BADNAME={'🧅':'בצל','🥦':'ברוקולי','🍣':'סושי'};
let talkOn=true, heVoice=null, voicesSeen=false;
try{if(localStorage.getItem('yj-talk')==='0')talkOn=false;}catch(e){}
function pickVoice(){try{const vs=speechSynthesis.getVoices();if(vs.length)voicesSeen=true;heVoice=vs.find(v=>/^he|^iw/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){}
function say(text,important){
  if(!talkOn||!('speechSynthesis' in window))return;
  if(voicesSeen&&!heVoice)return; // no Hebrew voice on this device: stay quiet rather than mispronounce
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending){if(!important)return;speechSynthesis.cancel();}
    const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=1.05;u.pitch=1.25;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

/* ---------- level ---------- */
let level=1, S;
function rnd(a,b){return a+Math.random()*(b-a);}
function build(){
  const len=2600+level*900, plats=[], goods=[], bads=[];
  let x=500;
  while(x<len-300){
    const w=rnd(160,260), y=rnd(300,380);
    plats.push({x,y,w,h:22});
    const n=Math.floor(w/70);
    for(let i=0;i<n;i++)goods.push(food(x+30+i*70,y-40));
    if(Math.random()<.5){const y2=y-rnd(110,140),w2=rnd(130,190),x2=x+rnd(60,180);plats.push({x:x2,y:y2,w:w2,h:22});goods.push(food(x2+w2/2,y2-40));}
    x+=w+rnd(170,280);
  }
  for(let gx=300;gx<len-300;gx+=rnd(150,260))if(Math.random()<.6)goods.push(food(gx,GROUND-40));
  const nm=level<3?1:2, moms=[];
  for(let i=1;i<=nm;i++)moms.push({x:Math.round(len*i/(nm+1)),face:-1,t:0,met:false,cd:0});
  const sis=[{x:Math.round(len*(nm>1?.5:.72)),face:-1,t:0,met:false,joy:0}];
  const nb=Math.min(2+level,8);
  for(let i=0;i<nb;i++){let bx=700+(len-1100)*(i+.5)/nb;
    for(const m of moms.concat(sis))if(Math.abs(bx-m.x)<200)bx=m.x+(bx<m.x?-200:200);
    bads.push({x:bx,y:GROUND-24,e:BAD[i%3]});}
  // no food right on top of a yucky one
  for(let i=goods.length-1;i>=0;i--){const g=goods[i];if(bads.some(b=>Math.abs(b.x-g.x)<70&&Math.abs(b.y-g.y)<60))goods.splice(i,1);}
  return {len,plats,goods,bads,moms,sis};
}
function food(x,y){const g=GOOD[Math.floor(Math.random()*4)];return {x,y,e:g.e,n:g.n,t:Math.random()*6,got:false};}
const clouds=Array.from({length:8},()=>({x:rnd(0,3000),y:rnd(40,200),s:rnd(.6,1.3)}));
const hills=Array.from({length:14},(_,i)=>({x:i*420+rnd(-60,60),r:rnd(160,260)}));

function newGame(keep){
  if(!keep){S={hearts:MAXH,counts:{avocado:0,chocolate:0,pasta:0,banana:0},total:0};}
  const L=build();
  Object.assign(S,L,{p:{x:120,y:GROUND-60,vx:0,vy:0,w:38,h:60,face:1,onG:true,coy:0,buf:0,hurt:0,run:0,yuck:0,happy:0},cam:0,fx:[],state:'play',won:0});
  S.hearts=Math.max(S.hearts,MAXH);S.hug=0;S.pause=0;S.hugMom=null;
  drawHud();
}

/* ---------- input ---------- */
const K={l:false,r:false,j:false};
const keymap={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{const k=keymap[e.code];if(k){e.preventDefault();if(k==='j'&&!K.j)S&&(S.p.buf=.15);K[k]=true;}if((e.code==='Enter'||e.code==='Space')&&!screen.hidden){e.preventDefault();startBtn&&startBtn.click();}});
addEventListener('keyup',e=>{const k=keymap[e.code];if(k)K[k]=false;});
function pad(id,k){const b=document.getElementById(id);
  const on=e=>{e.preventDefault();b.classList.add('on');if(k==='j'&&S)S.p.buf=.15;K[k]=true;};
  const off=e=>{e.preventDefault();b.classList.remove('on');K[k]=false;};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault());}
const talkBtn=document.getElementById('talk');
function syncTalk(){talkBtn.setAttribute('aria-pressed',talkOn?'true':'false');talkBtn.title=talkOn?'דיבור פועל':'דיבור כבוי';}
syncTalk();talkBtn.addEventListener('click',e=>{e.stopPropagation();talkOn=!talkOn;try{localStorage.setItem('yj-talk',talkOn?'1':'0');}catch(_){}
  syncTalk();if(talkOn)say('שלום שחר!',true);else{try{speechSynthesis.cancel();}catch(_){}}talkBtn.blur();});
pad('padL','l');pad('padR','r');pad('padJ','j');

/* ---------- update ---------- */
function update(dt){
  const p=S.p;
  S.fx=S.fx.filter(f=>(f.t-=dt)>0);
  S.fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.g||0)*dt;});
  S.goods.forEach(g=>g.t+=dt);
  S.sis.forEach(b=>{b.t+=dt;b.joy-=dt;b.face=p.x<b.x?-1:1;});
  S.moms.forEach(m=>{m.t+=dt;m.cd-=dt;if(!(S.hug>0&&S.hugMom===m))m.face=p.x<m.x?-1:1;});
  if(S.state!=='play')return;
  if(S.pause>0){S.pause-=dt;p.vx=0;
    const target=p.x-viewW*.35; S.cam+=(target-S.cam)*Math.min(1,dt*6); S.cam=Math.max(0,Math.min(S.len+120-viewW,S.cam));
    return;}
  if(S.hug>0){S.hug-=dt;p.vx=0;p.happy=.3;p.hurt=0;
    if(Math.random()<dt*10)S.fx.push({x:S.hugMom.x+rnd(-30,30),y:GROUND-110,vx:rnd(-20,20),vy:-70,t:1.2,heart:true});
    const target=p.x-viewW*.35; S.cam+=(target-S.cam)*Math.min(1,dt*6); S.cam=Math.max(0,Math.min(S.len+120-viewW,S.cam));
    if(S.hug<=0){p.hugging=false;S.hugMom.cd=2.5;}
    return;}
  const want=(K.r?1:0)-(K.l?1:0);
  p.vx+=(want*SPEED-p.vx)*Math.min(1,dt*(p.onG?14:8));
  if(want)p.face=want;
  p.coy-=dt;p.buf-=dt;p.hurt-=dt;p.yuck-=dt;p.happy-=dt;
  if(p.buf>0&&(p.onG||p.coy>0)){p.vy=-JUMP;p.onG=false;p.coy=0;p.buf=0;sfx.jump();}
  if(!K.j&&p.vy<-300)p.vy+=GRAV*dt*1.2; // short hop when released
  p.vy=Math.min(p.vy+GRAV*dt,1400);
  p.x+=p.vx*dt; p.x=Math.max(20,Math.min(S.len,p.x));
  const prevBottom=p.y+p.h; p.y+=p.vy*dt;
  const wasG=p.onG; p.onG=false;
  if(p.y+p.h>=GROUND){p.y=GROUND-p.h;p.vy=0;p.onG=true;}
  if(p.vy>=0)for(const pl of S.plats){if(p.x+p.w*.35>pl.x&&p.x-p.w*.35<pl.x+pl.w&&prevBottom<=pl.y+2&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.onG=true;}}
  if(wasG&&!p.onG&&p.vy>=0)p.coy=.12;
  if(p.onG)p.run+=Math.abs(p.vx)*dt*.03;
  const cx=p.x, cy=p.y+p.h/2;
  for(const g of S.goods){if(!g.got&&Math.abs(g.x-cx)<40&&Math.abs(g.y-cy)<50){g.got=true;p.happy=.9;S.counts[g.n]++;S.total++;sfx.yum();say(FOODNAME[g.n]+'! '+pick(['יאמי!','טעים!','מממ, טעים!','יאמי יאמי!']));
    S.fx.push({x:g.x,y:g.y-20,vx:0,vy:-60,t:.9,txt:'יאמי!'});
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;S.fx.push({x:g.x,y:g.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,t:.5,star:true});}
    drawHud();}}
  for(const m of S.moms){if(m.cd<=0&&p.y+p.h>GROUND-80&&Math.abs(m.x-cx)<38&&(!m.met||S.hearts<MAXH)){
    m.met=true;S.hug=1.6;S.hugMom=m;p.hugging=true;p.yuck=0;p.vy=0;
    p.face=cx<m.x?1:-1;m.face=-p.face;p.x=m.x-p.face*31;p.y=GROUND-p.h;p.onG=true;
    S.hearts=Math.max(S.hearts,MAXH);drawHud();sfx.hug();say(pick(['אמא! אני אוהב אותך!','חיבוק מאמא!','אמא! איזה כיף!']),true);
    S.fx.push({x:m.x,y:GROUND-150,vx:0,vy:-40,t:1.6,txt:'אמא!'});
    break;}}
  for(const b of S.sis){if(!b.met&&p.y+p.h>GROUND-80&&Math.abs(b.x-cx)<40){
    b.met=true;b.joy=2.2;p.happy=1.5;S.pause=1.1;p.vx=0;p.vy=0;p.y=GROUND-p.h;p.onG=true;p.face=cx<b.x?1:-1;p.x=b.x-p.face*34;S.hearts=Math.min(MAXB,S.hearts+2);drawHud();sfx.sis();say('אחותי הקטנה! עוד לבבות!',true);
    S.fx.push({x:b.x,y:GROUND-100,vx:0,vy:-40,t:1.6,txt:'אחותי!'});S.fx.push({x:b.x,y:GROUND-135,vx:0,vy:-40,t:1.6,txt:'+2 ❤️',ltr:true});
    for(let i=0;i<8;i++)S.fx.push({x:b.x+rnd(-40,40),y:GROUND-40,vx:rnd(-50,50),vy:rnd(-55,-30),t:1.3,heart:true});}}
  if(p.hurt<=0)for(const b of S.bads){if(Math.abs(b.x-cx)<32&&Math.abs(b.y-cy)<44){
    S.hearts--;p.hurt=1.8;p.yuck=1;p.vy=-420;p.vx=(cx<b.x?-1:1)*260;sfx.yuck();say('איכס! '+BADNAME[b.e]+'!',true);
    S.fx.push({x:cx,y:p.y-30,vx:0,vy:-50,t:1,txt:'איכס!',bad:true});drawHud();
    if(S.hearts<=0){S.state='over';setTimeout(()=>{show('over');say('ניסיון מעולה שחר! בוא ננסה שוב!',true);},900);}break;}}
  if(p.x>=S.len-60){S.state='win';sfx.win();say('כל הכבוד שחר! הגעת לדגל!',true);for(let i=0;i<60;i++)S.fx.push({x:S.len-40+rnd(-200,100),y:rnd(0,200),vx:rnd(-60,60),vy:rnd(0,120),g:120,t:3,conf:`hsl(${rnd(0,360)},90%,60%)`});setTimeout(showQuiz,1400);}
  const target=p.x-viewW*.35; S.cam+=(target-S.cam)*Math.min(1,dt*6); S.cam=Math.max(0,Math.min(S.len+120-viewW,S.cam));
}

/* ---------- draw ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  const sky=ctx.createLinearGradient(0,0,0,cv.height);sky.addColorStop(0,'#7fd3ff');sky.addColorStop(1,'#d8f3ff');ctx.fillStyle=sky;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,0,0);
  const cam=S?S.cam:0;
  // sun
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(viewW-110,95,48,0,7);ctx.fill();
  ctx.fillStyle='#ffe98a';ctx.beginPath();ctx.arc(viewW-110,95,62,0,7);ctx.globalAlpha=.35;ctx.fill();ctx.globalAlpha=1;
  // clouds
  ctx.fillStyle='#fff';
  clouds.forEach(c=>{const x=((c.x-cam*.2)%3000+3000)%3000-200;ctx.save();ctx.translate(x,c.y);ctx.scale(c.s,c.s);ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.arc(34,-14,38,0,7);ctx.arc(70,0,30,0,7);ctx.rect(0,0,70,30);ctx.fill();ctx.restore();});
  // hills
  ctx.fillStyle='#a6e3a1';
  hills.forEach(h=>{const x=((h.x-cam*.45)%5880+5880)%5880-300;ctx.beginPath();ctx.arc(x,GROUND+40,h.r,Math.PI,0);ctx.fill();});
  if(!S)return;
  ctx.save();ctx.translate(-cam,0);
  // ground
  ctx.fillStyle='#c98b4f';ctx.fillRect(cam-10,GROUND,viewW+20,H-GROUND);
  ctx.fillStyle='#5cc45c';ctx.fillRect(cam-10,GROUND,viewW+20,16);

}
function drawHud(){
  hud.hearts.textContent='❤️'.repeat(Math.max(0,Math.min(S.hearts,MAXH)))+'💖'.repeat(Math.max(0,S.hearts-MAXH))+'🤍'.repeat(Math.max(0,MAXH-S.hearts));
  hud.score.innerHTML=GOOD.map(g=>`<span dir="ltr">${g.e}${S.counts[g.n]}</span>`).join('');
}

/* ---------- screens ---------- */
let startBtn=null;
/* ---------- end-of-level math quiz ---------- */
const QNAME={avocado:['אבוקדו אחד','אבוקדו'],chocolate:['שוקולד אחד','שוקולדים'],pasta:['צלחת פסטה אחת','צלחות פסטה'],banana:['בננה אחת','בננות']};
function showQuiz(){
  const sum=2+Math.floor(Math.random()*9);            // 2..10
  const a=1+Math.floor(Math.random()*(sum-1)), b=sum-a; // both at least 1
  const fs=[...GOOD].sort(()=>Math.random()-.5), A=fs[0], B=fs[1];
  const opts=new Set([sum]);
  for(const d of [1,-1,2,-2,3,-3].sort(()=>Math.random()-.5)){const v=sum+d;if(v>=1&&v<=10&&opts.size<3)opts.add(v);}
  const answers=[...opts].sort((x,y)=>x-y);
  const phrase=(n,f)=>n===1?QNAME[f.n][0]:`${n} ${QNAME[f.n][1]}`;
  const q=`${phrase(a,A)} ועוד ${phrase(b,B)}`;
  cardBody.innerHTML=`<h1 class="qh">תרגיל קטן!</h1>
    <p>${q}. כמה זה ביחד?</p>
    <div class="eq"><span class="grp">${A.e.repeat(a)}</span><b>+</b><span class="grp">${B.e.repeat(b)}</span><span class="tail"><b>=</b><b class="qm">?</b></span></div>
    <div class="answers">${answers.map(v=>`<button class="ans" data-v="${v}">${v}</button>`).join('')}</div>
    <p class="hint" id="qhint">&nbsp;</p>`;
  screen.hidden=false;startBtn=null;
  say(q+'. כמה זה ביחד?',true);
  const btns=[...cardBody.querySelectorAll('.ans')];btns[0].focus();
  let done=false;
  btns.forEach(bt=>bt.addEventListener('click',()=>{
    if(done||bt.disabled)return;
    if(+bt.dataset.v===sum){done=true;bt.classList.add('right');cardBody.querySelector('.qm').textContent=sum;
      document.getElementById('qhint').textContent='נכון! כל הכבוד!';sfx.win();say('נכון! '+q+' זה '+sum+'! כל הכבוד!',true);
      setTimeout(()=>show('win'),2300);}
    else{bt.disabled=true;bt.classList.add('wrong');sfx.yuck();
      document.getElementById('qhint').textContent='כמעט! אפשר לספור ולנסות שוב';say('כמעט! בוא נספור ביחד ונסה שוב',true);}
  }));
}
function show(kind){
  let html;
  if(kind==='start')html=`<h1>קפיצה טעימה!</h1>
    <p>עזרו לשחר לרוץ עד הדגל הוורוד!</p>
    <div class="rows"><div><b>🥑🍫🍝🍌</b><small>יאמי! לאסוף</small></div><div><b>🧅🥦🍣</b><small>איכס! לקפוץ מעל</small></div><div><b>🤗</b><small>חיבוק מאמא ממלא לבבות</small></div><div><b>👶</b><small>אחות קטנה נותנת עוד לבבות</small></div></div>
    <button class="btn" id="go">יוצאים לדרך!</button>
    <p class="keys">במחשב: חיצים ורווח לקפיצה. בטלפון: הכפתורים הגדולים.</p>`;
  else if(kind==='win')html=`<h1>כל הכבוד שחר!</h1><p>סיימת את שלב ${level} ופתרת את התרגיל. תראו כמה אוכל טעים אספת:</p>
    <div class="rows">${GOOD.map(g=>`<div><b>${g.e}</b>${S.counts[g.n]}</div>`).join('')}</div>
    <button class="btn" id="go">לשלב הבא</button>`;
  else html=`<h1>ניסיון מעולה, שחר!</h1><p>אספת <b>${S.total}</b> מאכלים טעימים. רוצים לנסות שוב?</p>
    <div class="rows">${GOOD.map(g=>`<div><b>${g.e}</b>${S.counts[g.n]}</div>`).join('')}</div>
    <button class="btn" id="go">לשחק שוב</button>`;
  cardBody.innerHTML=html;screen.hidden=false;
  startBtn=document.getElementById('go');startBtn.focus();
  startBtn.onclick=()=>{
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
    if(kind==='win'){level++;newGame(true);say('שלב '+level+'! קדימה!',true);}else{level=1;newGame(false);say('יוצאים לדרך!',true);}
    screen.hidden=true;startBtn=null;cv.focus&&cv.focus();
  };
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(S&&screen.hidden)update(dt);else if(S)update(0);draw();requestAnimationFrame(loop);}
resize();level=1;newGame(false);S.state='idle';show('start');requestAnimationFrame(loop);
})();
</script>

</body>
